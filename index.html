<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RE:NNOCENT LAB | 크리에이터 가이드 허브</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
  :root{
    --sage:#5c7a63;
    --sage-dark:#3c5442;
    --sage-light:#e9efe6;
    --cream:#faf8f3;
    --paper:#ffffff;
    --ink:#1f2a22;
    --ink-soft:#5a6b5e;
    --line:#e2e2d8;
    --radius:18px;
    --shadow:0 8px 30px rgba(31,42,34,0.07);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Pretendard", -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
    background:var(--cream);
    color:var(--ink);
    line-height:1.6;
    letter-spacing:-0.01em;
    word-break:keep-all;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:520px;margin:0 auto;padding:0 20px;}

  .hero{
    background:
      linear-gradient(160deg, rgba(60,84,66,0.82) 0%, rgba(92,122,99,0.78) 65%, rgba(111,143,116,0.72) 100%),
      url("banner.png") center/cover no-repeat;
    color:#fff;
    padding:56px 20px 40px;
    text-align:center;
  }
  .hero .eyebrow{
    display:inline-block;font-size:11px;letter-spacing:.14em;
    padding:6px 12px;border:1px solid rgba(255,255,255,.5);
    border-radius:999px;margin-bottom:16px;opacity:.9;
  }
  .hero h1{font-size:24px;margin:0 0 8px;font-weight:800;}
  .hero p{font-size:13.5px;opacity:.88;margin:0;}

  /* ---------- LOCK SCREEN ---------- */
  #lock{
    max-width:340px;margin:40px auto 0;padding:0 20px 60px;
  }
  .lock-card{
    background:var(--paper);border:1px solid var(--line);
    border-radius:var(--radius);box-shadow:var(--shadow);
    padding:28px 24px;text-align:center;
  }
  .lock-card p{font-size:13.5px;color:var(--ink-soft);margin:0 0 18px;}
  .lock-card input{
    width:100%;padding:14px 16px;font-size:20px;letter-spacing:.3em;
    text-align:center;border:1px solid var(--line);border-radius:12px;
    outline:none;font-family:inherit;color:var(--ink);
    background:var(--cream);
  }
  .lock-card input:focus{border-color:var(--sage);}
  .lock-card button{
    width:100%;margin-top:14px;padding:14px;font-size:14.5px;font-weight:700;
    background:var(--sage-dark);color:#fff;border:none;border-radius:12px;
    cursor:pointer;font-family:inherit;
  }
  .lock-card button:active{background:var(--sage);}
  .lock-error{
    color:#a2402a;font-size:12.5px;font-weight:700;margin-top:12px;
    display:none;
  }
  .lock-error.show{display:block;}

  /* ---------- LIST ---------- */
  #list{display:none;padding:36px 0 60px;}
  .list-head{margin-bottom:20px;text-align:center;}
  .list-head .tag{font-size:11.5px;font-weight:700;color:var(--sage);letter-spacing:.1em;margin-bottom:6px;}
  .list-head h2{font-size:19px;margin:0;font-weight:800;}
  .card-grid{display:flex;flex-direction:column;gap:12px;}
  .guide-card{
    display:flex;align-items:center;gap:14px;
    background:var(--paper);border:1px solid var(--line);
    border-radius:14px;padding:16px 18px;
    text-decoration:none;color:var(--ink);
    box-shadow:var(--shadow);
    transition:transform .12s;
  }
  .guide-card:active{transform:scale(0.98);}
  .guide-card .badge{
    flex:none;width:38px;height:38px;border-radius:10px;
    background:var(--sage-light);color:var(--sage-dark);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:13px;
  }
  .guide-card .name{font-weight:800;font-size:15px;}
  .guide-card .sub{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .guide-card .arrow{margin-left:auto;color:var(--ink-soft);font-size:16px;flex:none;}

  footer{
    background:var(--sage-dark);color:#fff;
    padding:28px 20px;text-align:center;font-size:12px;opacity:.8;
  }
</style>
</head>
<body>

<div class="hero">
  <div class="wrap">
    <span class="eyebrow">CREATOR GUIDE HUB</span>
    <h1>RE:NNOCENT LAB</h1>
    <p>리노센트랩 클렌징 부스터 크리에이터 콘텐츠 가이드 허브</p>
  </div>
</div>

<div id="lock">
  <div class="lock-card">
    <p>비밀번호를 입력해 주세요.</p>
    <input type="password" id="pw" inputmode="numeric" maxlength="4" placeholder="••••" autofocus>
    <button type="button" id="pw-submit">확인</button>
    <div class="lock-error" id="pw-error">비밀번호가 올바르지 않습니다.</div>
  </div>
</div>

<div id="list">
  <div class="wrap">
    <div class="list-head">
      <div class="tag">SELECT GUIDE</div>
      <h2>확인하실 가이드를 선택해 주세요</h2>
    </div>
    <div class="card-grid" id="card-grid"></div>
  </div>
</div>

<footer>
  <div>Re:Nnocent Lab · Creator Guide</div>
</footer>

<script>
  var GUIDES = [
    { folder: "unified",  name: "통합모집용", sub: "Unified Recruitment" },
    { folder: "type-a",   name: "A Type",     sub: "5" },
    { folder: "type-b",   name: "B Type",     sub: "10" },
    { folder: "type-c",   name: "C Type",     sub: "15" },
    { folder: "type-d",   name: "D Type",     sub: "20" },
    { folder: "type-e",   name: "E Type",     sub: "25" },
    { folder: "type-f",   name: "F Type",     sub: "30" },
    { folder: "type-g",   name: "G Type",     sub: "고료조정" }
  ];
  var PASSWORD = "0907";
  var SESSION_KEY = "rennocent-hub-unlocked";

  var lockEl = document.getElementById('lock');
  var listEl = document.getElementById('list');
  var pwInput = document.getElementById('pw');
  var pwError = document.getElementById('pw-error');

  function renderList(){
    var grid = document.getElementById('card-grid');
    grid.innerHTML = '';
    GUIDES.forEach(function(g, i){
      var a = document.createElement('a');
      a.className = 'guide-card';
      a.href = g.folder + '/index.html';
      a.innerHTML =
        '<div class="badge">' + (i === 0 ? '★' : g.name.charAt(0)) + '</div>' +
        '<div><div class="name">' + g.name + '</div><div class="sub">' + g.sub + '</div></div>' +
        '<div class="arrow">›</div>';
      grid.appendChild(a);
    });
  }

  function unlock(){
    lockEl.style.display = 'none';
    listEl.style.display = 'block';
    renderList();
  }

  function tryUnlock(){
    if(pwInput.value === PASSWORD){
      try{ sessionStorage.setItem(SESSION_KEY, '1'); }catch(e){}
      pwError.classList.remove('show');
      unlock();
    } else {
      pwError.classList.add('show');
      pwInput.value = '';
      pwInput.focus();
    }
  }

  document.getElementById('pw-submit').addEventListener('click', tryUnlock);
  pwInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter') tryUnlock();
  });

  try{
    if(sessionStorage.getItem(SESSION_KEY) === '1'){ unlock(); }
  }catch(e){}
</script>

</body>
</html>
